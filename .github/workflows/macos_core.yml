name: macOS core build

# Builds the translator core on Apple silicon, including the shared library so
# that every symbol the core needs is checked at link time.

on:
  push:
    branches:
      - main
      - 'macos/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Fetch the third-party code the core needs
        run: |
          git submodule update --init --depth 1 \
            Source/Common/cpp-optparse \
            External/fmt \
            External/xxhash \
            External/rpmalloc \
            External/range-v3 \
            External/unordered_dense

      - name: Host details
        run: |
          uname -a
          sw_vers
          sysctl -n machdep.cpu.brand_string
          sysctl -n hw.pagesize
          clang --version
          cmake --version

      - name: Install Ninja
        # fmt is installed only so the linkage check below runs with a system fmt present:
        # a Homebrew dylib cannot be loaded under the hardened runtime.
        run: brew install ninja fmt

      - name: Configure
        run: |
          cmake -G Ninja -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DENABLE_LTO=OFF \
            -DENABLE_CCACHE=OFF

      - name: Build
        run: |
          set -o pipefail
          ninja -C build -k 0 FEXCore FEXCore_shared Common CommonTools FEXCoreSmokeTest FEXCoreASMTestRunner FEXCoreThreadTest FEXCoreOrderingTest FEXCoreOrderingSwitchTest FEXCoreOrderingSwitchTest_hooks FEXCoreMutexWakeTest FEXCoreBench FEXCoreCacheTest fexmac fexmac_shared fexmac_testing fexmac_bundle fexmac_c_test fexmac_hook_test fexmac_fault_diff 2>&1 | tee build.log

      - name: Inspect what was built
        run: |
          find build -name 'libFEXCore*' -o -name 'libCommon*.a' | sort | while read -r f; do
            ls -l "$f"
            file "$f" | cut -c1-160
          done
          echo "--- shared library dependencies"
          otool -L "$(find build -name 'libFEXCore*.dylib' | head -1)"

      - name: Check that only system libraries are linked
        # Fails if the core or a test tool links anything but libSystem and libc++, if
        # any of them is missing, or if the bundled fmt was not compiled.
        run: bash Scripts/macos_check_linkage.sh build

      - name: Check that the non-Apple side of the changed core files compiles
        # Strips the __APPLE__ blocks from the core files the port changes and compiles
        # them (syntax only): catches macOS-only declarations used outside a guard.
        run: bash Scripts/macos_check_nonapple.sh build

      - name: Run the smoke test
        run: |
          set -o pipefail
          T="$(find build -name FEXCoreSmokeTest -type f | head -1)"
          file "$T"
          # Allow a core file and print a backtrace if it crashes.
          ulimit -c unlimited || true
          set +e
          "$T" 2>&1 | tee smoke.log
          code=${PIPESTATUS[0]}
          set -e
          echo "smoke test exit code: $code"
          if [ "$code" -ne 0 ]; then
            echo "--- lldb backtrace"
            lldb --batch -o run -o "bt all" -o "register read" -o quit -- "$T" 2>&1 | tail -80 || true
          fi
          exit "$code"

      - name: Run the smoke test under the hardened runtime
        # A program that ships outside the App Store must use the hardened runtime.
        # There, code memory must be MAP_JIT and each thread must switch it between
        # writable and executable, so this run is the one that checks those paths.
        run: |
          set -o pipefail
          T="$(find build -name FEXCoreSmokeTest -type f | head -1)"
          cp "$T" FEXCoreSmokeTest-hardened
          codesign --force --sign - --options runtime --entitlements Data/macOS/jit.entitlements FEXCoreSmokeTest-hardened
          # The copy must really carry the hardened runtime and the JIT entitlement.
          sig="$(codesign -d --verbose=2 --entitlements - FEXCoreSmokeTest-hardened 2>&1)"
          echo "$sig" | grep -E 'flags|allow-jit'
          grep -q -E 'flags=0x[0-9a-f]+\([^)]*runtime' <<< "$sig"
          grep -q 'com.apple.security.cs.allow-jit' <<< "$sig"
          set +e
          ./FEXCoreSmokeTest-hardened 2>&1 | tee smoke-hardened.log
          code=${PIPESTATUS[0]}
          set -e
          echo "hardened smoke test exit code: $code"
          if [ "$code" -ne 0 ]; then
            ls -t ~/Library/Logs/DiagnosticReports/ 2>/dev/null | head -3 || true
            sleep 5
            R="$(ls -t ~/Library/Logs/DiagnosticReports/FEXCoreSmokeTest* 2>/dev/null | head -1)"
            [ -n "$R" ] && head -c 6000 "$R" || true
          fi
          exit "$code"

      - name: Run the embedding interface tests
        # A C program using only fexmac.h, linked against the standalone archive as an
        # outside project would be.
        run: |
          set -o pipefail
          T=build/Bin/fexmac_c_test
          echo "=== as built"
          "$T" 2>&1 | tee fexmac-c-test.log
          cp "$T" fexmac_c_test-hardened
          codesign --force --sign - --options runtime --entitlements Data/macOS/jit.entitlements fexmac_c_test-hardened
          echo "=== hardened runtime"
          ./fexmac_c_test-hardened 2>&1 | tee fexmac-c-test-hardened.log
          # Behaviour that needs the library's test hooks (fexmac_testing build only).
          build/Bin/fexmac_hook_test 2>&1 | tee fexmac-hook-test.log
          # The guard pages (code buffer, scratch buffer) as signed for the hardened runtime.
          cp build/Bin/fexmac_hook_test fexmac_hook_test-hardened
          codesign --force --sign - --options runtime --entitlements Data/macOS/jit.entitlements fexmac_hook_test-hardened
          ./fexmac_hook_test-hardened 2>&1 | tee fexmac-hook-test-hardened.log

      - name: Run the multi-thread test
        run: |
          set -o pipefail
          T="$(find build -name FEXCoreThreadTest -type f | head -1)"
          time "$T" 2>&1 | tee thread-test.log

      - name: Run the mutex wake-up test
        # A lost wake-up in the core's reader-writer lock on macOS hung threads that start
        # translating at the same moment. Deterministic; needs no special hardware.
        run: |
          set -o pipefail
          T="$(find build -name FEXCoreMutexWakeTest -type f | head -1)"
          "$T" 2>&1 | tee mutex-wake.log

      - name: Run the memory-ordering test
        # x86 ordering between guest threads with the emulation on, as built and under the
        # hardened runtime (the misaligned tests take alignment faults that back-patch
        # translated code). Then with it off and with only the general setting on: on a
        # physical Mac the forbidden outcomes must appear, which shows the test can tell
        # the settings apart. The physical-Mac results are in docs/macOS-port-status.md.
        run: |
          set -o pipefail
          T="$(find build -name FEXCoreOrderingTest -type f | head -1)"
          time "$T" --tso on 2>&1 | tee ordering-on.log
          cp "$T" FEXCoreOrderingTest-hardened
          codesign --force --sign - --options runtime --entitlements Data/macOS/jit.entitlements FEXCoreOrderingTest-hardened
          time ./FEXCoreOrderingTest-hardened --tso on 2>&1 | tee ordering-on-hardened.log
          # String instructions in 8-byte ordered units (MEMCPYSETTSOWIDE, off by default).
          time ./FEXCoreOrderingTest-hardened --tso on --option MEMCPYSETTSOWIDE=1 2>&1 | tee ordering-on-wide-hardened.log
          # Many short runs: eight threads start translating together each time, which is
          # what hung on the lost mutex wake-up.
          time ./FEXCoreOrderingTest-hardened --tso on --only SB --runs 1000 --iterations 200 2>&1 | tail -3
          # With emulation off, and with only the general setting on, the tests that must
          # break depend on the hardware: on the hosted virtual machine a test that does
          # not break (exit 1) only warns. A stall (exit 3), a crash, a guest thread that
          # did not finish (BROKEN), threads that never overlapped (NOT RACING) or a test
          # that must hold but broke still fail the job.
          # TSODEFERRED: message passing across the switch from unordered to ordered
          # translation (0 forbidden outcomes), as built and hardened; then deliberately
          # broken switches (test hooks build), which must show forbidden outcomes on a
          # physical Mac (only a warning where the hardware does not reorder).
          S="$(find build -name FEXCoreOrderingSwitchTest -type f | head -1)"
          cp "$S" FEXCoreOrderingSwitchTest-hardened
          codesign --force --sign - --options runtime --entitlements Data/macOS/jit.entitlements FEXCoreOrderingSwitchTest-hardened
          ./FEXCoreOrderingSwitchTest-hardened litmus --trials 2000 2>&1 | tee ordering-switch.log
          ./FEXCoreOrderingSwitchTest-hardened litmus --trials 500 --pattern call 2>&1 | tee -a ordering-switch.log
          for stores in fxsave fxrstor; do
            ./FEXCoreOrderingSwitchTest-hardened litmus --trials 300 --mode on --stores "$stores" 2>&1 | tee -a ordering-switch.log
          done
          for pattern in callret misaligned smc cbcreate cbmark; do
            ./FEXCoreOrderingSwitchTest-hardened litmus --trials 300 --pattern "$pattern" 2>&1 | tee -a ordering-switch.log
          done
          for broken in "no-wait loop" "no-discard loop" "keep-callret callret"; do
            set -- $broken
            "$(find build -name FEXCoreOrderingSwitchTest_hooks -type f | head -1)" litmus --trials 200 --break "$1" --pattern "$2" 2>&1 | tee -a ordering-switch.log \
              || echo "::warning::the broken switch ($1) showed no forbidden outcome on this machine"
          done
          for mode in off scalar; do
            set +e
            ./FEXCoreOrderingTest-hardened --tso "$mode" > "ordering-$mode.log" 2>&1
            code=$?
            set -e
            cat "ordering-$mode.log"
            if [ "$code" -eq 0 ]; then
              continue
            fi
            if [ "$code" -eq 1 ] && ! grep -q -E 'BROKEN|NOT RACING|FAIL \(TSO-forbidden outcome seen\)' "ordering-$mode.log"; then
              echo "::warning::with --tso $mode a forbidden outcome that an M4 shows was not seen on this machine"
            else
              echo "ordering test with --tso $mode failed (exit $code)"
              exit 1
            fi
          done

      - name: Run the guest benchmark (checksums only)
        # A freestanding x86-64 program (unittests/macOS/Bench) run through fexmac by
        # FEXCoreBench, in quick mode, as built and hardened: the literal mode (no system
        # call but exit; exit criterion 7) must report every checksum right, and in the
        # timed mode every kernel's checksum must match the recorded value and the native
        # arm64 build (and Rosetta 2's, where the runner has it). No timing is checked
        # here; docs/macOS-benchmarks.md has the measured numbers. The mutation test
        # checks that each checksum sees the work its kernel does.
        run: |
          set -o pipefail
          python3 Scripts/macos_bench_mutations.py --out bench-mutations 2>&1 | tee bench-mutations.log
          # Every speed figure in the documents must come from the committed results file.
          python3 Scripts/macos_bench.py --check-docs 2>&1 | tee bench-docs-check.log
          python3 Scripts/macos_bench.py --loader build/Bin/FEXCoreBench --out bench-quick --quick 2>&1 | tee bench-quick.log
          python3 Scripts/macos_bench.py --loader build/Bin/FEXCoreBench --out bench-quick-hardened --quick --hardened 2>&1 | tee bench-quick-hardened.log

      - name: Run the assembly instruction tests
        run: |
          brew list nasm >/dev/null 2>&1 || brew install nasm
          T="$(find build -name FEXCoreASMTestRunner -type f | head -1)"
          set -o pipefail
          python3 Scripts/macos_asm_tests.py --runner "$T" --out asm-out 2>&1 | tee asm-tests.log
          # The script fails on an unexpected failure. The check also fails on an expected
          # failure that now passes (a stale Known_Failures_macOS entry), on tests that
          # were not found or prepared, and on a pass count below the floor in
          # Scripts/macos_asm_floor.txt (pass_virtual: this VM lacks some CPU features).
          python3 Scripts/macos_asm_check.py asm-tests.log --modes 4 --full-virtual

      - name: Run the differential guest-fault test
        # Guest state at a page fault, after resuming, and through the write-protection
        # path, compared with reference runs (Scripts/macos_fault_diff.py).
        run: |
          set -o pipefail
          python3 Scripts/macos_fault_diff.py --tool build/Bin/fexmac_fault_diff 2>&1 | tee fault-diff.log

      - name: Run the self-modifying-code instruction tests with write protection
        # SMCCHECKS mtrack with the runner's memory registered with fexmac: translated
        # pages are write-protected and a guest write discards their code. Uses ordinary
        # page protection, so the hosted Mac can show it (as it can fexmac_c_test's
        # guest-fault, stop-request and smc subtests; only their timings differ).
        run: |
          T="$(find build -name FEXCoreASMTestRunner -type f | head -1)"
          set -o pipefail
          python3 Scripts/macos_asm_tests.py --runner "$T" --out asm-smc --filter SelfModifyingCode --smc mtrack 2>&1 | tee asm-smc-tests.log
          python3 Scripts/macos_asm_check.py asm-smc-tests.log --modes 4
          [ "$(grep -c -E '^== jit[^:]*: pass 3$' asm-smc-tests.log)" -eq 4 ]

      - name: Run the code cache tests
        # Damaged and mismatched cache files, moving guest code, eight threads loading the
        # same cached blocks, directory rules. See docs/macOS-code-cache-design.md.
        run: |
          set -o pipefail
          R="$(find build -name FEXCoreASMTestRunner -type f | head -1)"
          C="$(find build -name FEXCoreCacheTest -type f | head -1)"
          python3 Scripts/macos_code_cache_tests.py --runner "$R" --cache-test "$C" --work cache-tests 2>&1 | tee cache-tests.log
          cp "$C" FEXCoreCacheTest-hardened
          codesign --force --sign - --options runtime --entitlements Data/macOS/jit.entitlements FEXCoreCacheTest-hardened
          FEX_DISKCACHE=1 FEX_DISKCACHEPATH="$PWD/cache-hardened" ./FEXCoreCacheTest-hardened --threads 8 2>&1 | tail -3 | tee -a cache-tests.log
          FEX_DISKCACHE=1 FEX_DISKCACHEPATH="$PWD/cache-hardened" ./FEXCoreCacheTest-hardened --threads 8 --expect warm 2>&1 | tail -3 | tee -a cache-tests.log

      - name: Run the instruction tests twice with the code cache
        # Cold pass fills the cache, warm pass must compile nothing and give the same
        # results. Two modes here to bound the job's time; every mode on a physical Mac.
        run: |
          set -o pipefail
          T="$(find build -name FEXCoreASMTestRunner -type f | head -1)"
          python3 Scripts/macos_asm_tests.py --runner "$T" --out asm-cache --modes jit_500,jit_500_tso \
            --cache-dir asm-code-cache --cache-passes 2 2>&1 | tee asm-cache-tests.log
          # jit_1 found the 3DNow! displacement patching bug (Frontend.cpp): keep it covered.
          python3 Scripts/macos_asm_tests.py --runner "$T" --out asm-cache-jit1 --modes jit_1 \
            --filter 3DNow/,TwoByte/,SelfModifyingCode/,FEX_bugs/ \
            --cache-dir asm-code-cache-jit1 --cache-passes 2 2>&1 | tee asm-cache-jit1-tests.log
          python3 Scripts/macos_asm_check.py asm-cache-tests.log --modes 2 --full-virtual
          python3 Scripts/macos_asm_check.py asm-cache-jit1-tests.log --modes 1

      - name: Show instruction tests that did not behave as listed
        # No debugger here: the runner prints the faulting address of a crash, and
        # results.tsv carries it with the reason from the expected-failure list.
        if: failure()
        run: |
          for f in asm-out/results.tsv asm-cache/results.tsv asm-cache-jit1/results.tsv; do
            [ -f "$f" ] || continue
            echo "=== $f"
            awk -F'\t' '$3 ~ /^unexpected-/' "$f" | head -60
          done

      - name: Probe the low-memory rule
        if: always()
        run: |
          set -o pipefail
          printf 'int main(void){return 0;}\n' > lowmem.c
          clang -o lowmem-default lowmem.c
          clang -o lowmem-pagezero lowmem.c -Wl,-pagezero_size,0x4000
          clang -o lowmem-imagebase lowmem.c -Wl,-image_base,0x400000000000
          for t in lowmem-default lowmem-pagezero lowmem-imagebase; do
            set +e; ./$t; code=$?; set -e
            echo "$t: exit code $code"
          done 2>&1 | tee lowmem.log

      - name: Probe executable-memory behaviour
        if: always()
        # Report only (this VM does not enforce write protection, so --expect-enforced
        # would fail); the physical-Mac job asserts it. A probe that crashes still fails.
        run: |
          set -o pipefail
          clang -O1 -o JITWriteProbe Source/Tools/JITWriteProbe/Main.c
          echo "=== probe: as built"
          ./JITWriteProbe 2>&1 | tee probe.log
          codesign --force --sign - --options runtime --entitlements Data/macOS/jit.entitlements JITWriteProbe
          grep -q -E 'flags=0x[0-9a-f]+\([^)]*runtime' <<< "$(codesign -d --verbose=2 JITWriteProbe 2>&1)"
          echo "=== probe: hardened runtime"
          ./JITWriteProbe 2>&1 | tee probe-hardened.log

      - name: Check the upstream sync script
        if: always()
        # Offline: throwaway repositories in a temporary directory with spaces in its
        # path, a local stand-in for upstream, and macOS's own bash 3.2. Checks the
        # never-push hardening for every remote address form, each refusal by its exit
        # status and message, that the dry run changes nothing, and that a clean merge,
        # a conflict and a merge that does not start are told apart.
        run: |
          /bin/bash -n Scripts/macos_sync_upstream.sh
          Scripts/macos_sync_upstream.sh --help | grep -q 'default macos/v1'
          /bin/bash Scripts/macos_sync_upstream_test.sh

      - name: Summarise errors
        if: always()
        run: |
          {
            echo "## macOS core build"
            if [ -f build.log ]; then
              echo
              echo "Errors: $(grep -c ' error: ' build.log || true)"
              echo
              echo "### Files with errors"
              echo '```'
              grep ' error: ' build.log | sed -E 's/:[0-9]+:[0-9]+: error:.*//' | sort | uniq -c | sort -rn | head -60
              echo '```'
              echo "### Most common messages"
              echo '```'
              grep ' error: ' build.log | sed -E 's/^.*: error: //' | sort | uniq -c | sort -rn | head -40
              echo '```'
            else
              echo "No build log: configure failed."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: macos-core-build-log
          path: |
            build.log
            smoke.log
            smoke-hardened.log
            probe.log
            asm-tests.log
            asm-cache-tests.log
            asm-cache/cache.tsv
            asm-cache-jit1-tests.log
            cache-tests.log
            thread-test.log
            fexmac-c-test.log
            fexmac-c-test-hardened.log
            fexmac-hook-test.log
            ordering-on.log
            ordering-on-hardened.log
            ordering-off.log
            ordering-scalar.log
            mutex-wake.log
            bench-quick.log
            bench-quick-hardened.log
            bench-mutations.log
            asm-out/results.tsv
            probe-hardened.log
            build/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore
