name: Linux arm64 build and instruction tests

# The macOS port's branches built natively on Linux (GitHub's hosted arm64 Ubuntu), so a
# change for macOS cannot break the Linux build unnoticed, and upstream's instruction tests
# run on a second arm64 platform through upstream's own machinery for comparison with the
# Mac's results (Scripts/macos_linux_asm_compare.py).
#
#   core-only  BUILD_FEXCORE_ONLY=ON, the configuration the port adds: FEXCore,
#              FEXCore_shared, Common, CommonTools. The port's own tools (smoke test,
#              thread test, ASM test runner, fexmac) are Apple-only by design.
#   asm-tests  the ordinary Linux configuration with testing on: TestHarnessRunner and
#              the 64-bit assembly tests through CTest (upstream's asm_tests machinery,
#              with upstream's Known_Failures and Disabled_Tests lists). No x86-64 root
#              file system is needed for these tests; nasm is.

on:
  push:
    branches:
      - 'macos/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-arm64-${{ github.ref }}
  cancel-in-progress: true

env:
  CC: clang
  CXX: clang++

jobs:
  core-only:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Fetch the third-party code the core needs
        run: |
          git submodule update --init --depth 1 Source/Common/cpp-optparse External/fmt External/xxhash \
            External/rpmalloc External/range-v3 External/unordered_dense External/jemalloc_glibc

      - name: Install tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ninja-build clang lld python3
          uname -a; clang --version | head -1; cmake --version | head -1; getconf PAGESIZE

      - name: Configure (core only)
        run: |
          cmake -G Ninja -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_FEXCORE_ONLY=ON -DBUILD_TESTING=OFF \
            -DENABLE_LTO=OFF -DENABLE_CCACHE=OFF -DENABLE_ASSERTIONS=ON -DUSE_LINKER=lld 2>&1 | tee configure.log

      - name: Build
        run: |
          set -o pipefail
          ninja -C build -k 0 FEXCore FEXCore_shared Common CommonTools 2>&1 | tee build.log

      - name: Check the port's macOS-only targets are absent and nothing macOS leaked in
        run: |
          grep -q 'CoreSmokeTest: not built' configure.log
          if ninja -C build -t targets all | grep -E '^(fexmac[a-z_]*|FEXCoreSmokeTest|FEXCoreASMTestRunner):'; then
            echo "a macOS-only target exists in the Linux build"; exit 1
          fi
          find build -name 'libFEXCore*' -exec ls -l {} +
          # Exported symbols of the shared core: none of the port's macOS entry points.
          so="$(find build -name 'libFEXCore*.so' | head -1)"
          if nm -D --defined-only "$so" | grep -i -E 'fexmac|_np$'; then echo "macOS symbols in $so"; exit 1; fi

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: linux-core-only-logs
          path: |
            configure.log
            build.log
          if-no-files-found: ignore

  linux-tests:
    # The same job twice: on the port's commit, and on the upstream commit the port is
    # based on (the merge base with FEX-Emu/FEX main, fetched read-only), so a Linux
    # failure can be told apart: the port's fault if it fails only on the port.
    name: linux-tests (${{ matrix.source }})
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        source: [port, upstream-base]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: ${{ matrix.source == 'port' && 1 || 0 }}
          filter: ${{ matrix.source == 'port' && '' || 'blob:none' }}
          persist-credentials: false

      - name: Go to the upstream base
        if: matrix.source == 'upstream-base'
        run: |
          git fetch -q --no-tags --filter=blob:none https://github.com/FEX-Emu/FEX.git main:refs/remotes/upstream-ro/main
          base="$(git merge-base HEAD upstream-ro/main)"
          echo "port $(git rev-parse --short=9 HEAD), upstream base $base"
          # Keep this run's comparison script: it is the port's, not upstream's.
          cp Scripts/macos_linux_asm_compare.py "$RUNNER_TEMP/"
          git checkout -q --detach "$base"
          git log -1 --format='%h %ci %s'

      - name: Fetch third-party code (not the large test-binary repositories)
        run: |
          git submodule update --init --depth 1 Source/Common/cpp-optparse External/fmt External/xxhash \
            External/rpmalloc External/range-v3 External/unordered_dense External/jemalloc_glibc \
            External/Catch2 External/vixl External/drm-headers External/Vulkan-Headers External/tracy External/zydis
          [ -f "$RUNNER_TEMP/macos_linux_asm_compare.py" ] || cp Scripts/macos_linux_asm_compare.py "$RUNNER_TEMP/"

      - name: Install tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ninja-build clang lld nasm python3
          uname -a; clang --version | head -1; nasm -v; getconf PAGESIZE
          grep -m1 -E 'Features' /proc/cpuinfo || true
          python3 Scripts/ClassifyCPU.py

      - name: Configure (Linux, testing on)
        run: |
          cmake -G Ninja -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DENABLE_LTO=OFF \
            -DENABLE_CCACHE=OFF -DENABLE_ASSERTIONS=ON -DBUILD_FEXCONFIG=OFF -DUSE_LINKER=lld 2>&1 | tee configure.log

      - name: Build everything (FEXLoader, FEXServer, TestHarnessRunner, unit tests, test files)
        run: |
          set -o pipefail
          ninja -C build -k 0 2>&1 | tee build.log

      - name: Run the 64-bit instruction tests through CTest
        # A red result here means a test did not behave as upstream's lists say on this
        # machine. The table of raw outcomes is uploaded for comparison with the Mac.
        run: |
          cd build
          set +e
          ctest --timeout 302 -j "$(nproc)" -R '64Bit.*\.asm$' --output-on-failure --output-junit linux-asm.xml > ../ctest.log 2>&1
          code=$?
          set -e
          tail -30 ../ctest.log
          python3 "$RUNNER_TEMP/macos_linux_asm_compare.py" --root .. --junit linux-asm.xml --out ../linux-asm-results.tsv | tee ../linux-asm-counts.log
          exit $code

      - name: Show the instruction tests that failed, run directly
        # No output reaches CTest's log for a test that dies; run each failing one again
        # with its environment, then under gdb for a backtrace (gdb works on this Linux
        # host; it is the Mac where debuggers hang).
        if: failure()
        run: |
          sudo apt-get install -y -q gdb > /dev/null
          awk -F'\t' '$4 == "failed" { print $1 "\t" $2 }' linux-asm-results.tsv | head -5 | while IFS=$'\t' read -r mode name; do
            rel="${name#Test_}"
            bin="build/unittests/ASM/$rel.bin"; cfg="build/unittests/ASM/$rel.config.bin"
            case "$mode" in
              jit_1) env="FEX_MAXINST=1 FEX_MULTIBLOCK=0" ;;
              jit_500) env="FEX_MAXINST=500 FEX_MULTIBLOCK=0" ;;
              jit_500_m) env="FEX_MAXINST=500 FEX_MULTIBLOCK=1" ;;
            esac
            echo "=== $mode $name"
            set +e
            env FEX_SILENTLOG=0 FEX_DUMPGPRS=1 FEX_TSOENABLED=0 $env timeout 120 build/Bin/TestHarnessRunner "$bin" "$cfg" 2>&1 | tail -40
            echo "exit status ${PIPESTATUS[0]}"
            env FEX_SILENTLOG=0 FEX_TSOENABLED=0 $env timeout 300 gdb -q -batch -ex 'handle SIGSEGV nostop noprint pass' \
              -ex 'handle SIGBUS nostop noprint pass' -ex run -ex 'bt 30' -ex 'info registers pc' \
              --args build/Bin/TestHarnessRunner "$bin" "$cfg" 2>&1 | tail -50
            set -e
          done

      - name: Run upstream's unit tests that need no root file system
        # The tests of upstream's fexcore_apitests, api_tests and emitter_tests targets.
        # The FutexSpin-Timed tests measure wall-clock waits and fail on these shared
        # virtual machines on the upstream base too (seen in the first runs), so they are
        # left out here.
        if: ${{ !cancelled() }}
        run: |
          cd build
          set +e
          ctest --timeout 302 -j "$(nproc)" -R '\.FEXCore_Tests$|\.APITest$|\.Emitter$' -E 'FutexSpin-Timed' \
            --output-on-failure > ../unit-tests.log 2>&1
          code=$?
          grep -E 'tests passed|tests failed|\(Failed\)|\(Timeout\)' ../unit-tests.log | tail -20
          exit $code

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: linux-tests-${{ matrix.source }}
          path: |
            configure.log
            build.log
            ctest.log
            unit-tests.log
            linux-asm-results.tsv
            linux-asm-counts.log
          if-no-files-found: ignore

  compare:
    # Port against upstream base, test by test, on the same kind of machine.
    needs: linux-tests
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          pattern: linux-tests-*
      - name: Compare
        run: |
          ls -R linux-tests-* | head
          python3 Scripts/macos_linux_asm_compare.py --linux linux-tests-port/linux-asm-results.tsv \
            --base linux-tests-upstream-base/linux-asm-results.tsv
